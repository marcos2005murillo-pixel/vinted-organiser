<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Armario Digital - Vinted</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-zinc-800 selection:text-white">

    <!-- CABECERA -->
    <header class="sticky top-0 z-40 bg-zinc-900/80 backdrop-blur-md border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button id="back-btn" onclick="goHome()" class="hidden text-zinc-400 hover:text-white transition p-2 rounded-xl hover:bg-zinc-800">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <h1 id="app-title" class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                <i class="fa-solid fa-shirt text-zinc-400"></i> Mi Armario
            </h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openNewFolderModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 border border-zinc-700/50">
                <i class="fa-solid fa-folder-plus"></i> <span class="hidden sm:inline">Nueva Carpeta</span>
            </button>
            <button onclick="openAddModal()" class="bg-white text-zinc-950 hover:bg-zinc-200 px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Añadir Prenda</span>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
        
        <!-- VISTA 1: TARJETAS DE CARPETAS (HOME) -->
        <section id="folders-view" class="space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold tracking-tight">Carpetas</h2>
                <span id="folders-count" class="text-xs text-zinc-400 bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-full">0 carpetas</span>
            </div>
            
            <div id="folders-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>

        <!-- VISTA 2: DETALLE DE CARPETA (PRENDAS) -->
        <section id="folder-detail-view" class="hidden space-y-6">
            <div class="flex items-center justify-between bg-zinc-900/50 border border-zinc-800/60 p-4 rounded-2xl">
                <div>
                    <h2 id="current-folder-name" class="text-xl font-bold tracking-tight text-white">Nombre de Carpeta</h2>
                    <p id="current-folder-count" class="text-xs text-zinc-400 mt-0.5">0 prendas guardadas</p>
                </div>
                <button onclick="deleteCurrentFolder()" class="text-red-400 hover:text-red-300 hover:bg-red-500/10 p-2.5 rounded-xl transition text-sm flex items-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Eliminar Carpeta</span>
                </button>
            </div>

            <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>

    </main>

    <!-- MODAL: AÑADIR PRENDA NUEVA -->
    <div id="add-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in-95 duration-200">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold tracking-tight">Añadir Prenda</h3>
                <button onclick="closeAddModal()" class="text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-zinc-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="scraping-status" class="hidden bg-zinc-800/60 border border-zinc-700/50 p-3 rounded-2xl text-xs text-zinc-300 flex items-center gap-3">
                <div class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin shrink-0"></i></div>
                <span id="scraping-text">Extrayendo datos de Vinted...</span>
            </div>

            <form id="add-form" onsubmit="handleAddItem(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Enlace de Vinted</label>
                    <input type="url" id="item-url" required placeholder="https://www.vinted.es/items/..." 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nombre de la Prenda</label>
                    <input type="text" id="item-title" required placeholder="Ej. Jersey Stradivarius" 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Guardar en Carpeta</label>
                    <select id="item-folder" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                        <!-- Opciones dinámicas -->
                    </select>
                </div>

                <!-- Input oculto para la imagen detectada o fallback -->
                <input type="hidden" id="item-image-url" value="">

                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 rounded-xl text-sm transition">Cancelar</button>
                    <button type="submit" class="flex-1 bg-white hover:bg-zinc-200 text-zinc-950 font-semibold py-3 rounded-xl text-sm transition shadow-sm">Guardar Prenda</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: NUEVA CARPETA -->
    <div id="new-folder-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold tracking-tight">Nueva Carpeta</h3>
                <button onclick="closeNewFolderModal()" class="text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-zinc-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form onsubmit="handleCreateFolder(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nombre de la carpeta</label>
                    <input type="text" id="new-folder-name" required placeholder="Ej. Marcos, Fiesta, Otoño..." 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="closeNewFolderModal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 rounded-xl text-sm transition">Cancelar</button>
                    <button type="submit" class="flex-1 bg-white hover:bg-zinc-200 text-zinc-950 font-semibold py-3 rounded-xl text-sm transition">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: VISTA PREVIA EN GRANDE Y EDICIÓN DE PRENDA -->
    <div id="item-detail-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-6">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold tracking-tight">Detalle de la Prenda</h3>
                <button onclick="closeItemDetailModal()" class="text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-zinc-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Imagen grande -->
            <div class="w-full h-72 sm:h-80 bg-zinc-950 rounded-2xl overflow-hidden border border-zinc-800/80 flex items-center justify-center relative">
                <img id="detail-image" src="" alt="Prenda" class="w-full h-full object-cover">
                <a id="detail-vinted-link" href="#" target="_blank" class="absolute bottom-3 right-3 bg-zinc-900/90 hover:bg-zinc-900 border border-zinc-700/80 text-white px-3.5 py-2 rounded-xl text-xs font-semibold backdrop-blur-md transition flex items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Abrir en Vinted
                </a>
            </div>

            <!-- Formulario de edición -->
            <form id="edit-item-form" onsubmit="handleSaveItemEdit(event)" class="space-y-4">
                <input type="hidden" id="edit-item-id">
                
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nombre</label>
                    <input type="text" id="edit-item-title" required 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Enlace de Vinted</label>
                    <input type="url" id="edit-item-url" required 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Mover a Carpeta</label>
                    <select id="edit-item-folder" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                        <!-- Opciones dinámicas -->
                    </select>
                </div>

                <div class="pt-3 flex items-center justify-between border-t border-zinc-800">
                    <button type="button" onclick="deleteItemFromDetail()" class="text-red-400 hover:text-red-300 hover:bg-red-500/10 px-4 py-2.5 rounded-xl transition text-sm font-medium flex items-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> Eliminar Prenda
                    </button>
                    <div class="flex gap-2">
                        <button type="button" onclick="closeItemDetailModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2.5 rounded-xl text-sm font-medium transition">Cancelar</button>
                        <button type="submit" class="bg-white hover:bg-zinc-200 text-zinc-950 px-5 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm">Guardar Cambios</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- LOGICA JAVASCRIPT & INDEXEDDB -->
    <script>
        let db;
        let currentFolderId = null; // null significa vista de carpetas (Home)
        let activeEditingItem = null;

        // Inicializar IndexedDB
        const request = indexedDB.open('VintedWardrobeDB', 2);

        request.onerror = (event) => console.error("Error en IndexedDB:", event.target.error);

        request.onupgradeneeded = (event) => {
            db = event.target.result;
            if (!db.objectStoreNames.contains('folders')) {
                db.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains('items')) {
                const itemStore = db.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
                itemStore.createIndex('folderId', 'folderId', { unique: false });
            }
        };

        request.onsuccess = (event) => {
            db = event.target.result;
            seedDefaultFolderIfNeeded();
        };

        function seedDefaultFolderIfNeeded() {
            const tx = db.transaction('folders', 'readwrite');
            const store = tx.objectStore('folders');
            const countReq = store.count();

            countReq.onsuccess = () => {
                if (countReq.result === 0) {
                    const addReq = store.add({ name: 'Desperdigados', createdAt: Date.now() });
                    addReq.onsuccess = () => checkUrlParamsAndLoad();
                } else {
                    checkUrlParamsAndLoad();
                }
            };
        }

        function checkUrlParamsAndLoad() {
            loadFoldersView();

            // Comprobar si viene desde el atajo de iOS con parámetros ?url=...&title=...
            const params = new URLSearchParams(window.location.search);
            const shareUrl = params.get('url');
            const shareTitle = params.get('title');

            if (shareUrl) {
                openAddModal(shareUrl, shareTitle || '');
                // Limpiar la URL sin recargar la página
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // --- GESTIÓN DE VISTAS (HOME vs CARPETA) ---
        function goHome() {
            currentFolderId = null;
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('app-title').innerHTML = `<i class="fa-solid fa-shirt text-zinc-400"></i> Mi Armario`;
            document.getElementById('folders-view').classList.remove('hidden');
            document.getElementById('folder-detail-view').classList.add('hidden');
            loadFoldersView();
        }

        function openFolder(folderId, folderName) {
            currentFolderId = folderId;
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('app-title').textContent = folderName;
            document.getElementById('folders-view').classList.add('hidden');
            document.getElementById('folder-detail-view').classList.remove('hidden');
            loadFolderItems(folderId, folderName);
        }

        // --- CARGAR CARPETAS (HOME GRID) ---
        function loadFoldersView() {
            const tx = db.transaction(['folders', 'items'], 'readonly');
            const folderStore = tx.objectStore('folders');
            const itemStore = tx.index('folderId');
            const foldersReq = folderStore.getAll();

            foldersReq.onsuccess = () => {
                const folders = foldersReq.result;
                const grid = document.getElementById('folders-grid');
                document.getElementById('folders-count').textContent = `${folders.length} ${folders.length === 1 ? 'carpeta' : 'carpetas'}`;
                grid.innerHTML = '';

                if (folders.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500 text-sm">No hay carpetas creadas.</div>`;
                    return;
                }

                folders.forEach(folder => {
                    // Buscar elementos de esta carpeta para sacar miniatura de portada
                    const itemReq = itemStore.getAll(folder.id);
                    itemReq.onsuccess = () => {
                        const items = itemReq.result;
                        const coverImg = items.length > 0 ? items[items.length - 1].image : null;
                        const initial = folder.name.charAt(0).toUpperCase();

                        const card = document.createElement('div');
                        card.className = "group bg-zinc-900 border border-zinc-800/80 hover:border-zinc-700 rounded-3xl overflow-hidden cursor-pointer transition-all duration-300 shadow-sm hover:shadow-xl flex flex-col";
                        card.onclick = () => openFolder(folder.id, folder.name);

                        let coverHTML = '';
                        if (coverImg && coverImg.startsWith('http')) {
                            coverHTML = `<img src="${coverImg}" class="w-full h-44 sm:h-52 object-cover group-hover:scale-105 transition duration-500" alt="${folder.name}">`;
                        } else {
                            coverHTML = `<div class="w-full h-44 sm:h-52 bg-zinc-800 flex items-center justify-center text-zinc-500 font-bold text-4xl group-hover:scale-105 transition duration-500">${initial}</div>`;
                        }

                        card.innerHTML = `
                            <div class="relative overflow-hidden bg-zinc-950">${coverHTML}</div>
                            <div class="p-4 flex items-center justify-between bg-zinc-900">
                                <div>
                                    <h3 class="font-bold text-sm sm:text-base text-white tracking-tight">${folder.name}</h3>
                                    <p class="text-xs text-zinc-400 mt-0.5">${items.length} ${items.length === 1 ? 'prenda' : 'prendas'}</p>
                                </div>
                                <div class="w-8 h-8 rounded-full bg-zinc-800/80 flex items-center justify-center text-zinc-400 group-hover:bg-white group-hover:text-zinc-950 transition">
                                    <i class="fa-solid fa-chevron-right text-xs"></i>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    };
                });
            };
        }

        // --- CARGAR PRENDAS DENTRO DE UNA CARPETA ---
        function loadFolderItems(folderId, folderName) {
            const tx = db.transaction('items', 'readonly');
            const store = tx.index('folderId');
            const req = store.getAll(folderId);

            req.onsuccess = () => {
                const items = req.result;
                const grid = document.getElementById('items-grid');
                document.getElementById('current-folder-name').textContent = folderName;
                document.getElementById('current-folder-count').textContent = `${items.length} ${items.length === 1 ? 'prenda guardada' : 'prendas guardadas'}`;
                grid.innerHTML = '';

                if (items.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16 space-y-3">
                            <div class="w-12 h-12 bg-zinc-900 border border-zinc-800 rounded-2xl flex items-center justify-center mx-auto text-zinc-500 text-lg">
                                <i class="fa-solid fa-shirt"></i>
                            </div>
                            <p class="text-zinc-400 text-sm">Esta carpeta está vacía.</p>
                        </div>`;
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "group bg-zinc-900 border border-zinc-800/80 hover:border-zinc-700 rounded-3xl overflow-hidden cursor-pointer transition-all duration-300 shadow-sm hover:shadow-xl flex flex-col";
                    card.onclick = () => openItemDetailModal(item);

                    card.innerHTML = `
                        <div class="relative overflow-hidden bg-zinc-950 h-48 sm:h-60">
                            <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${item.title}">
                        </div>
                        <div class="p-4 bg-zinc-950 flex flex-col justify-between flex-1">
                            <h4 class="font-medium text-xs sm:text-sm text-zinc-200 line-clamp-2 leading-snug">${item.title}</h4>
                            <div class="mt-3 pt-3 border-t border-zinc-9ut flex items-center justify-between text-xs text-zinc-500">
                                <span>Ver detalles</span>
                                <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-1 transition text-zinc-400"></i>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            };
        }

        // --- CREAR NUEVA CARPETA ---
        function openNewFolderModal() {
            document.getElementById('new-folder-modal').classList.remove('hidden');
            document.getElementById('new-folder-name').value = '';
            document.getElementById('new-folder-name').focus();
        }
        function closeNewFolderModal() {
            document.getElementById('new-folder-modal').classList.add('hidden');
        }
        function handleCreateFolder(e) {
            e.preventDefault();
            const name = document.getElementById('new-folder-name').value.trim();
            if (!name) return;

            const tx = db.transaction('folders', 'readwrite');
            const store = tx.objectStore('folders');
            const req = store.add({ name, createdAt: Date.now() });

            req.onsuccess = () => {
                closeNewFolderModal();
                loadFoldersView();
            };
        }

        // --- ELIMINAR CARPETA ACTUAL ---
        function deleteCurrentFolder() {
            if (!currentFolderId) return;
            if (!confirm("¿Seguro que quieres eliminar esta carpeta? Las prendas dentro de ella también se eliminarán.")) return;

            const tx = db.transaction(['folders', 'items'], 'readwrite');
            const folderStore = tx.objectStore('folders');
            const itemStore = tx.index('folderId');

            // Borrar items de la carpeta
            const itemReq = itemStore.getAllKeys(currentFolderId);
            itemReq.onsuccess = () => {
                const itemStoreRw = tx.objectStore('items');
                itemReq.result.forEach(itemId => itemStoreRw.delete(itemId));
                
                // Borrar carpeta
                folderStore.delete(currentFolderId);

                tx.oncomplete = () => {
                    goHome();
                };
            };
        }

        // --- MODAL AÑADIR PRENDA Y SCRAPING ---
        async function openAddModal(prefillUrl = '', prefillTitle = '') {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('item-url').value = prefillUrl;
            document.getElementById('item-title').value = prefillTitle;
            document.getElementById('item-image-url').value = '';

            // Poblar selector de carpetas
            await updateFolderSelects();
            if (currentFolderId) {
                document.getElementById('item-folder').value = currentFolderId;
            }

            if (prefillUrl) {
                extractVintedData(prefillUrl);
            } else {
                document.getElementById('item-url').focus();
            }
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('scraping-status').classList.add('hidden');
        }

        async function updateFolderSelects() {
            return new Promise((resolve) => {
                const tx = db.transaction('folders', 'readonly');
                const store = tx.objectStore('folders');
                const req = store.getAll();

                req.onsuccess = () => {
                    const folders = req.result;
                    const selects = [document.getElementById('item-folder'), document.getElementById('edit-item-folder')];
                    
                    selects.forEach(select => {
                        if (!select) return;
                        select.innerHTML = '';
                        folders.forEach(f => {
                            const opt = document.createElement('option');
                            opt.value = f.id;
                            opt.textContent = f.name;
                            select.appendChild(opt);
                        });
                    });
                    resolve();
                };
            });
        }

        // Extractor con respaldo robusto
        async function extractVintedData(url) {
            const statusBox = document.getElementById('scraping-status');
            const statusText = document.getElementById('scraping-text');
            statusBox.classList.remove('hidden');
            statusText.textContent = "Extrayendo imagen de Vinted...";

            let imageUrl = '';
            const proxies = [
                `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy);
                    const html = proxy.includes('allorigins') ? (await res.json()).contents : await res.text();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    const ogImage = doc.querySelector('meta[property="og:image"]');
                    const ogTitle = doc.querySelector('meta[property="og:title"]');

                    if (ogImage && ogImage.content) {
                        imageUrl = ogImage.content;
                    }
                    if (ogTitle && !document.getElementById('item-title').value) {
                        document.getElementById('item-title').value = ogTitle.content;
                    }
                    if (imageUrl) break;
                } catch (e) {
                    console.warn("Fallo con proxy, intentando siguiente...", e);
                }
            }

            if (imageUrl) {
                document.getElementById('item-image-url').value = imageUrl;
                statusText.textContent = "¡Imagen extraída con éxito!";
            } else {
                // Fallback robusto a plantilla gris genérica
                document.getElementById('item-image-url').value = "https://placehold.co/600x800/18181b/71717a?text=20";
                statusText.textContent = "Vinted protegido. Guardando con miniatura estándar.";
            }

            setTimeout(() => statusBox.classList.add('hidden'), 2500);
        }

        function handleAddItem(e) {
            e.preventDefault();
            const url = document.getElementById('item-url').value;
            const title = document.getElementById('item-title').value;
            const folderId = parseInt(document.getElementById('item-folder').value);
            let image = document.getElementById('item-image-url').value;

            if (!image) {
                image = "https://placehold.co/600x800/18181b/71717a?text=20";
            }

            const tx = db.transaction('items', 'readwrite');
            const store = tx.objectStore('items');
            const req = store.add({ folderId, title, url, image, createdAt: Date.now() });

            req.onsuccess = () => {
                closeAddModal();
                if (currentFolderId) {
                    openFolder(currentFolderId, document.getElementById('current-folder-name').textContent);
                } else {
                    loadFoldersView();
                }
            };
        }

        // --- VISTA PREVIA EN GRANDE Y EDICIÓN DE PRENDA ---
        async function openItemDetailModal(item) {
            activeEditingItem = item;
            document.getElementById('detail-image').src = item.image;
            document.getElementById('detail-vinted-link').href = item.url;
            document.getElementById('edit-item-id').value = item.id;
            document.getElementById('edit-item-title').value = item.title;
            document.getElementById('edit-item-url').value = item.url;

            await updateFolderSelects();
            document.getElementById('edit-item-folder').value = item.folderId;

            document.getElementById('item-detail-modal').classList.remove('hidden');
        }

        function closeItemDetailModal() {
            document.getElementById('item-detail-modal').classList.add('hidden');
            activeEditingItem = null;
        }

        function handleSaveItemEdit(e) {
            e.preventDefault();
            if (!activeEditingItem) return;

            const updatedTitle = document.getElementById('edit-item-title').value;
            const updatedUrl = document.getElementById('edit-item-url').value;
            const updatedFolderId = parseInt(document.getElementById('edit-item-folder').value);

            const tx = db.transaction('items', 'readwrite');
            const store = tx.objectStore('items');

            const updatedItem = {
                ...activeEditingItem,
                title: updatedTitle,
                url: updatedUrl,
                folderId: updatedFolderId
            };

            const req = store.put(updatedItem);

            req.onsuccess = () => {
                closeItemDetailModal();
                if (currentFolderId) {
                    openFolder(currentFolderId, document.getElementById('current-folder-name').textContent);
                } else {
                    loadFoldersView();
                }
            };
        }

        function deleteItemFromDetail() {
            if (!activeEditingItem) return;
            if (!confirm("¿Seguro que quieres eliminar esta prenda?")) return;

            const tx = db.transaction('items', 'readwrite');
            const store = tx.objectStore('items');
            const req = store.delete(activeEditingItem.id);

            req.onsuccess = () => {
                closeItemDetailModal();
                if (currentFolderId) {
                    openFolder(currentFolderId, document.getElementById('current-folder-name').textContent);
                } else {
                    loadFoldersView();
                }
            };
        }
    </script>
</body>
</html>

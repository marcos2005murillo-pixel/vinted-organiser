<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinted Organiser</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #09b1ba; /* Color Vinted */
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .preview-box {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            background-color: #0f172a;
            border: 1px dashed var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 5px;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .status-badge {
            display: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .status-badge.active {
            display: block;
            background-color: rgba(9, 177, 186, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Armario Organiser</h1>
    </header>

    <div id="status-banner" class="status-badge">
        ✨ Enlace importado desde Vinted
    </div>

    <!-- Formulario de Ingesta / Agregar Prenda -->
    <div class="card">
        <form id="prenda-form" onsubmit="guardarPrenda(event)">
            
            <div class="form-group">
                <label for="vinted-url">Enlace de Vinted</label>
                <input type="url" id="vinted-url" placeholder="https://www.vinted.es/items/..." required readonly>
            </div>

            <div class="form-group">
                <label for="prenda-nombre">Nombre de la Prenda</label>
                <input type="text" id="prenda-nombre" placeholder="Ej: Camiseta Ferrari / Jeans True Religion" required>
            </div>

            <div class="form-group">
                <label for="prenda-carpeta">Carpeta / Armario</label>
                <select id="prenda-carpeta" required>
                    <option value="Camisetas">Camisetas</option>
                    <option value="Pantalones">Pantalones</option>
                    <option value="Sudaderas">Sudaderas</option>
                    <option value="Chaquetas">Chaquetas</option>
                    <option value="Zapatillas">Zapatillas</option>
                    <option value="Favoritos">Favoritos</option>
                </select>
            </div>

            <div class="form-group">
                <label>Vista previa de la Prenda</label>
                <div class="preview-box" id="preview-container">
                    <span id="preview-placeholder" style="color: var(--text-muted); font-size: 0.85rem;">Cargando imagen...</span>
                    <img id="preview-img" src="" alt="Vista previa" style="display: none;">
                </div>
            </div>

            <button type="submit" class="btn-primary">Guardar en mi Armario</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Parsear parámetros de la URL enviados por el Atajo de iOS
        const params = new URLSearchParams(window.location.search);
        const enlaceImportado = params.get('importar');

        if (enlaceImportado) {
            procesarEnlaceImportado(enlaceImportado);

            // Limpiar el parámetro ?importar= de la barra del navegador sin recargar la página
            const urlLimpia = window.location.pathname;
            window.history.replaceState({}, document.title, urlLimpia);
        }
    });

    function procesarEnlaceImportado(url) {
        const inputUrl = document.getElementById('vinted-url');
        const inputNombre = document.getElementById('prenda-nombre');
        const banner = document.getElementById('status-banner');
        
        // 1. Asignar la URL capturada al input
        inputUrl.value = url;
        banner.classList.add('active');

        // 2. Extraer un nombre provisional a partir de la URL de Vinted
        try {
            const pathParts = new URL(url).pathname.split('/');
            const itemSlug = pathParts[pathParts.indexOf('items') + 1] || '';
            if (itemSlug) {
                // Formatear el slug borrando IDs numéricos y guiones
                const nombreLimpio = itemSlug
                    .replace(/^\d+-/, '')
                    .replace(/-/g, ' ');
                
                // Capitalizar primera letra de cada palabra
                inputNombre.value = nombreLimpio.replace(/\b\w/g, l => l.toUpperCase());
            }
        } catch (e) {
            console.log("No se pudo autogenerar el nombre desde la URL", e);
        }

        // 3. Obtener la imagen directamente desde la vista previa del enlace
        obtenerImagenVinted(url);
    }

    function obtenerImagenVinted(url) {
        const previewImg = document.getElementById('preview-img');
        const placeholder = document.getElementById('preview-placeholder');

        // Usamos la API de microlink como proxy seguro para sacar la foto de Vinted
        const apiUrl = `https://api.microlink.io?url=${encodeURIComponent(url)}`;

        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success' && data.data.image) {
                    previewImg.src = data.data.image.url;
                    previewImg.style.display = 'block';
                    placeholder.style.display = 'none';
                } else {
                    placeholder.textContent = 'No se pudo cargar la imagen automáticamente';
                }
            })
            .catch(err => {
                console.error("Error al obtener metadatos de Vinted:", err);
                placeholder.textContent = 'Añade la prenda a mano o guarda sin foto';
            });
    }

    function guardarPrenda(event) {
        event.preventDefault();

        const nuevaPrenda = {
            url: document.getElementById('vinted-url').value,
            nombre: document.getElementById('prenda-nombre').value,
            carpeta: document.getElementById('prenda-carpeta').value,
            imagen: document.getElementById('preview-img').src || null,
            fecha: new Date().toISOString()
        };

        console.log("Prenda lista para guardar en Supabase:", nuevaPrenda);
        alert(`¡Prenda "${nuevaPrenda.nombre}" lista para guardar en la carpeta ${nuevaPrenda.carpeta}!`);
        
        // Aquí conectaremos la llamada final a Supabase en el siguiente paso
    }
</script>

</body>
</html>

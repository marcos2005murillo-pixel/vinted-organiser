<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Armario Digital - Vinted</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-zinc-800 selection:text-white">

    <!-- CABECERA -->
    <header class="sticky top-0 z-40 bg-zinc-900/80 backdrop-blur-md border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button id="back-btn" onclick="goHome()" class="hidden text-zinc-400 hover:text-white transition p-2 rounded-xl hover:bg-zinc-800">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <h1 id="app-title" class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                <i class="fa-solid fa-shirt text-zinc-400"></i> Mi Armario
            </h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openNewFolderModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 border border-zinc-700/50">
                <i class="fa-solid fa-folder-plus"></i> <span class="hidden sm:inline">Nueva Carpeta</span>
            </button>
            <button onclick="openAddModal()" class="bg-white text-zinc-950 hover:bg-zinc-200 px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Añadir Prenda</span>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
        
        <!-- VISTA 1: TARJETAS DE CARPETAS (HOME) -->
        <section id="folders-view" class="space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold tracking-tight">Carpetas</h2>
                <span id="folders-count" class="text-xs text-zinc-400 bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-full">0 carpetas</span>
            </div>
            
            <div id="folders-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>

        <!-- VISTA 2: DETALLE DE CARPETA (PRENDAS) -->
        <section id="folder-detail-view" class="hidden space-y-6">
            <div class="flex items-center justify-between bg-zinc-900/50 border border-zinc-800/60 p-4 rounded-2xl">
                <div>
                    <h2 id="current-folder-name" class="text-xl font-bold tracking-tight text-white">Nombre de Carpeta</h2>
                    <p id="current-folder-count" class="text-xs text-zinc-400 mt-0.5">0 prendas guardadas</p>
                </div>
                <button onclick="deleteCurrentFolder()" class="text-red-400 hover:text-red-300 hover:bg-red-500/10 p-2.5 rounded-xl transition text-sm flex items-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Eliminar Carpeta</span>
                </button>
            </div>

            <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>

    </main>

    <!-- MODAL: AÑADIR PRENDA NUEVA -->
    <div id="add-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold tracking-tight">Añadir Prenda</h3>
                <button onclick="closeAddModal()" class="text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-zinc-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- ESTADO DE EXTRAE FOTO -->
            <div id="scraping-status" class="hidden bg-zinc-800/60 border border-zinc-700/50 p-3 rounded-2xl text-xs text-zinc-300 flex items-center gap-3">
                <div class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin shrink-0"></div>
                <span id="scraping-text">Buscando automáticamente la foto real de Vinted...</span>
            </div>

            <!-- VISTA PREVIA DE LA IMAGEN ENCONTRADA -->
            <div id="image-preview-container" class="hidden w-full h-48 bg-zinc-950 rounded-2xl overflow-hidden border border-zinc-800 relative">
                <img id="image-preview" src="" alt="Prenda" class="w-full h-full object-cover">
            </div>

            <form onsubmit="handleAddItem(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Enlace de Vinted</label>
                    <input type="url" id="item-url" required placeholder="https://www.vinted.es/items/..." 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nombre de la Prenda</label>
                    <input type="text" id="item-title" required placeholder="Ej. Chaqueta Vinted" 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Guardar en Carpeta</label>
                    <select id="item-folder" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                        <!-- Opciones dinámicas -->
                    </select>
                </div>

                <input type="hidden" id="item-image-url" value="">

                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 rounded-xl text-sm transition">Cancelar</button>
                    <button type="submit" id="save-btn" disabled class="flex-1 bg-white hover:bg-zinc-200 text-zinc-950 font-semibold py-3 rounded-xl text-sm transition shadow-sm opacity-40 cursor-not-allowed">Esperando foto automática...</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: NUEVA CARPETA -->
    <div id="new-folder-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold tracking-tight">Nueva Carpeta</h3>
                <button onclick="closeNewFolderModal()" class="text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-zinc-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form onsubmit="handleCreateFolder(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nombre de la carpeta</label>
                    <input type="text" id="new-folder-name" required placeholder="Ej. Marcos, Carol..." 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="closeNewFolderModal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 rounded-xl text-sm transition">Cancelar</button>
                    <button type="submit" class="flex-1 bg-white hover:bg-zinc-200 text-zinc-950 font-semibold py-3 rounded-xl text-sm transition">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: VISTA PREVIA Y EDICIÓN -->
    <div id="item-detail-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-6">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold tracking-tight">Detalle de la Prenda</h3>
                <button onclick="closeItemDetailModal()" class="text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-zinc-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="w-full h-72 sm:h-80 bg-zinc-950 rounded-2xl overflow-hidden border border-zinc-800/80 flex items-center justify-center relative">
                <img id="detail-image" src="" alt="Prenda" class="w-full h-full object-cover">
                <a id="detail-vinted-link" href="#" target="_blank" class="absolute bottom-3 right-3 bg-zinc-900/90 hover:bg-zinc-900 border border-zinc-700/80 text-white px-3.5 py-2 rounded-xl text-xs font-semibold backdrop-blur-md transition flex items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Abrir en Vinted
                </a>
            </div>

            <form onsubmit="handleSaveItemEdit(event)" class="space-y-4">
                <input type="hidden" id="edit-item-id">
                
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nombre</label>
                    <input type="text" id="edit-item-title" required 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Enlace de Vinted</label>
                    <input type="url" id="edit-item-url" required 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Mover a Carpeta</label>
                    <select id="edit-item-folder" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-500 transition">
                        <!-- Opciones dinámicas -->
                    </select>
                </div>

                <div class="pt-3 flex items-center justify-between border-t border-zinc-800">
                    <button type="button" onclick="deleteItemFromDetail()" class="text-red-400 hover:text-red-300 hover:bg-red-500/10 px-4 py-2.5 rounded-xl transition text-sm font-medium flex items-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> Eliminar Prenda
                    </button>
                    <div class="flex gap-2">
                        <button type="button" onclick="closeItemDetailModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2.5 rounded-xl text-sm font-medium transition">Cancelar</button>
                        <button type="submit" class="bg-white hover:bg-zinc-200 text-zinc-950 px-5 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm">Guardar Cambios</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT CORREGIDO CON EXTRACCIÓN REAL DE FOTO -->
    <script>
        let db;
        let currentFolderId = null;
        let activeEditingItem = null;
        let activeScrapeRequestId = 0;
        let urlInputDebounce = null;

        // La lógica JavaScript del navegador está integrada en este index.html.
        // El Worker NO se puede incrustar aquí: debe ejecutarse en un servidor para consultar Vinted.
        // Después de desplegar vinted-image-worker.js, pega aquí la URL real que te asigne Cloudflare.
        const VINTED_METADATA_WORKER = 'https://vinted-image-worker.marcos2005murillo.workers.dev';

        function initAppDatabase() {
            const request = indexedDB.open('VintedArmarioAppDB_v25', 1);

            request.onerror = (e) => console.error("Error DB:", e);

            request.onupgradeneeded = (event) => {
                const dbRef = event.target.result;
                if (!dbRef.objectStoreNames.contains('folders')) {
                    dbRef.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
                }
                if (!dbRef.objectStoreNames.contains('items')) {
                    const itemStore = dbRef.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
                    itemStore.createIndex('folderId', 'folderId', { unique: false });
                }
            };

            request.onsuccess = (event) => {
                db = event.target.result;
                ensureDefaultFolders();
            };
        }

        function ensureDefaultFolders() {
            const tx = db.transaction('folders', 'readwrite');
            const store = tx.objectStore('folders');
            const req = store.getAll();

            req.onsuccess = () => {
                const folders = req.result;
                if (!folders || folders.length === 0) {
                    store.add({ name: 'Desperdigadas', createdAt: Date.now() });
                    store.add({ name: 'Carol', createdAt: Date.now() });
                    store.add({ name: 'Marcos', createdAt: Date.now() });
                    tx.oncomplete = () => checkUrlParamsAndLoad();
                } else {
                    checkUrlParamsAndLoad();
                }
            };
        }

        function checkUrlParamsAndLoad() {
            loadFoldersView();

            const params = new URLSearchParams(window.location.search);
            const rawShare = params.get('importar') || params.get('url') || params.get('text');
            const shareTitle = params.get('title');

            if (rawShare) {
                const shareUrl = extractFirstUrl(rawShare);
                if (shareUrl) {
                    openAddModal(shareUrl, shareTitle || '');
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }

        function extractFirstUrl(text) {
            const match = text.match(/(https?:\/\/[^\s]+)/g);
            return match ? match[0] : text;
        }

        function goHome() {
            currentFolderId = null;
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('app-title').innerHTML = `<i class="fa-solid fa-shirt text-zinc-400"></i> Mi Armario`;
            document.getElementById('folders-view').classList.remove('hidden');
            document.getElementById('folder-detail-view').classList.add('hidden');
            loadFoldersView();
        }

        function openFolder(folderId, folderName) {
            currentFolderId = folderId;
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('app-title').textContent = folderName;
            document.getElementById('folders-view').classList.add('hidden');
            document.getElementById('folder-detail-view').classList.remove('hidden');
            loadFolderItems(folderId, folderName);
        }

        function loadFoldersView() {
            if (!db) return;
            const tx = db.transaction(['folders', 'items'], 'readonly');
            const folderStore = tx.objectStore('folders');
            const itemStore = tx.objectStore('items');
            const index = itemStore.index('folderId');

            const foldersReq = folderStore.getAll();
            foldersReq.onsuccess = () => {
                const folders = foldersReq.result || [];
                const grid = document.getElementById('folders-grid');
                document.getElementById('folders-count').textContent = `${folders.length} ${folders.length === 1 ? 'carpeta' : 'carpetas'}`;
                grid.innerHTML = '';

                if (folders.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500 text-sm">No hay carpetas creadas.</div>`;
                    return;
                }

                folders.forEach(folder => {
                    const itemReq = index.getAll(folder.id);
                    itemReq.onsuccess = () => {
                        const items = itemReq.result || [];
                        const coverImg = items.length > 0 ? items[items.length - 1].image : null;
                        const initial = folder.name.charAt(0).toUpperCase();

                        const card = document.createElement('div');
                        card.className = "group bg-zinc-900 border border-zinc-800/80 hover:border-zinc-700 rounded-3xl overflow-hidden cursor-pointer transition-all duration-300 shadow-sm hover:shadow-xl flex flex-col";
                        card.onclick = () => openFolder(folder.id, folder.name);

                        let coverHTML = '';
                        if (coverImg && coverImg.startsWith('http')) {
                            coverHTML = `<img src="${coverImg}" class="w-full h-44 sm:h-52 object-cover group-hover:scale-105 transition duration-500" alt="${folder.name}">`;
                        } else {
                            coverHTML = `<div class="w-full h-44 sm:h-52 bg-zinc-800 flex items-center justify-center text-zinc-500 font-bold text-4xl group-hover:scale-105 transition duration-500">${initial}</div>`;
                        }

                        card.innerHTML = `
                            <div class="relative overflow-hidden bg-zinc-950">${coverHTML}</div>
                            <div class="p-4 flex items-center justify-between bg-zinc-900">
                                <div>
                                    <h3 class="font-bold text-sm sm:text-base text-white tracking-tight">${folder.name}</h3>
                                    <p class="text-xs text-zinc-400 mt-0.5">${items.length} ${items.length === 1 ? 'prenda' : 'prendas'}</p>
                                </div>
                                <div class="w-8 h-8 rounded-full bg-zinc-800/80 flex items-center justify-center text-zinc-400 group-hover:bg-white group-hover:text-zinc-950 transition">
                                    <i class="fa-solid fa-chevron-right text-xs"></i>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    };
                });
            };
        }

        function loadFolderItems(folderId, folderName) {
            const tx = db.transaction('items', 'readonly');
            const store = tx.objectStore('items');
            const index = store.index('folderId');
            const req = index.getAll(folderId);

            req.onsuccess = () => {
                const items = req.result || [];
                const grid = document.getElementById('items-grid');
                document.getElementById('current-folder-name').textContent = folderName;
                document.getElementById('current-folder-count').textContent = `${items.length} ${items.length === 1 ? 'prenda guardada' : 'prendas guardadas'}`;
                grid.innerHTML = '';

                if (items.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16 space-y-3">
                            <div class="w-12 h-12 bg-zinc-900 border border-zinc-800 rounded-2xl flex items-center justify-center mx-auto text-zinc-500 text-lg">
                                <i class="fa-solid fa-shirt"></i>
                            </div>
                            <p class="text-zinc-400 text-sm">Esta carpeta está vacía.</p>
                        </div>`;
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "group bg-zinc-900 border border-zinc-800/80 hover:border-zinc-700 rounded-3xl overflow-hidden cursor-pointer transition-all duration-300 shadow-sm hover:shadow-xl flex flex-col";
                    card.onclick = () => openItemDetailModal(item);

                    card.innerHTML = `
                        <div class="relative overflow-hidden bg-zinc-950 h-48 sm:h-60">
                            <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${item.title}">
                        </div>
                        <div class="p-4 bg-zinc-950 flex flex-col justify-between flex-1">
                            <h4 class="font-medium text-xs sm:text-sm text-zinc-200 line-clamp-2 leading-snug">${item.title}</h4>
                            <div class="mt-3 pt-3 border-t border-zinc-900 flex items-center justify-between text-xs text-zinc-500">
                                <span>Ver detalles</span>
                                <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-1 transition text-zinc-400"></i>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            };
        }

        function openNewFolderModal() {
            document.getElementById('new-folder-modal').classList.remove('hidden');
            document.getElementById('new-folder-name').value = '';
            document.getElementById('new-folder-name').focus();
        }
        function closeNewFolderModal() {
            document.getElementById('new-folder-modal').classList.add('hidden');
        }

        function handleCreateFolder(e) {
            e.preventDefault();
            const name = document.getElementById('new-folder-name').value.trim();
            if (!name || !db) return;

            const tx = db.transaction('folders', 'readwrite');
            const store = tx.objectStore('folders');
            const req = store.add({ name, createdAt: Date.now() });

            req.onsuccess = () => {
                closeNewFolderModal();
                loadFoldersView();
            };
        }

        function deleteCurrentFolder() {
            if (!currentFolderId) return;
            if (!confirm("¿Seguro que quieres eliminar esta carpeta y sus prendas?")) return;

            const tx = db.transaction(['folders', 'items'], 'readwrite');
            const folderStore = tx.objectStore('folders');
            const itemStore = tx.objectStore('items');
            const index = itemStore.index('folderId');

            const itemReq = index.getAllKeys(currentFolderId);
            itemReq.onsuccess = () => {
                itemReq.result.forEach(itemId => itemStore.delete(itemId));
                folderStore.delete(currentFolderId);

                tx.oncomplete = () => {
                    goHome();
                };
            };
        }

        async function openAddModal(prefillUrl = '', prefillTitle = '') {
            activeScrapeRequestId++;
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('item-url').value = prefillUrl;
            document.getElementById('item-image-url').value = '';
            document.getElementById('image-preview').removeAttribute('src');
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('scraping-status').classList.add('hidden');
            setAddSaveState(false, 'Esperando foto automática...');

            let smartTitle = prefillTitle;
            if (!smartTitle && prefillUrl) smartTitle = generateTitleFromUrl(prefillUrl);
            document.getElementById('item-title').value = smartTitle || 'Prenda de Vinted';

            await updateFolderSelects();
            if (currentFolderId) document.getElementById('item-folder').value = currentFolderId;

            if (prefillUrl) {
                fetchRealVintedData(prefillUrl);
            } else {
                document.getElementById('item-url').focus();
            }
        }

        function generateTitleFromUrl(url) {
            try {
                const urlObj = new URL(url);
                const segments = urlObj.pathname.split('/').filter(Boolean);
                const lastSegment = segments[segments.length - 1];
                if (lastSegment) {
                    let namePart = lastSegment.replace(/^\d+[-_]?/, '');
                    if (namePart) {
                        namePart = namePart.replace(/[-_]/g, ' ');
                        return namePart.split(' ')
                            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                            .join(' ');
                    }
                }
            } catch (e) {}
            return 'Prenda de Vinted';
        }

        function closeAddModal() {
            activeScrapeRequestId++;
            if (urlInputDebounce) clearTimeout(urlInputDebounce);
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('scraping-status').classList.add('hidden');
        }

        async function updateFolderSelects() {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction('folders', 'readonly');
                const store = tx.objectStore('folders');
                const req = store.getAll();

                req.onsuccess = () => {
                    const folders = req.result || [];
                    const selects = [document.getElementById('item-folder'), document.getElementById('edit-item-folder')];
                    
                    selects.forEach(select => {
                        if (!select) return;
                        select.innerHTML = '';
                        folders.forEach(f => {
                            const opt = document.createElement('option');
                            opt.value = f.id;
                            opt.textContent = f.name;
                            select.appendChild(opt);
                        });
                    });
                    resolve();
                };
            });
        }

        function setAddSaveState(enabled, label) {
            const button = document.getElementById('save-btn');
            button.disabled = !enabled;
            button.textContent = label || (enabled ? 'Guardar Prenda' : 'Esperando foto automática...');
            button.classList.toggle('opacity-40', !enabled);
            button.classList.toggle('cursor-not-allowed', !enabled);
        }

        function isVintedListingUrl(value) {
            try {
                const u = new URL(value);
                const supportedHost = /^([a-z0-9-]+\.)?vinted\.(es|com|fr|it|pt|de|nl|be|pl|co\.uk|at|ch|lu|cz|sk|hu|lt|lv|ee|se|dk|fi|gr|ro|bg|hr|si)$/i.test(u.hostname);
                return u.protocol === 'https:' && supportedHost && /\/items?\//i.test(u.pathname);
            } catch (_) {
                return false;
            }
        }

        function isVintedImageUrl(value) {
            try {
                const u = new URL(value);
                return u.protocol === 'https:' && /^images\d*\.vinted\.net$/i.test(u.hostname);
            } catch (_) {
                return false;
            }
        }

        function waitForImageToLoad(url, timeoutMs = 10000) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                let finished = false;
                const timer = setTimeout(() => finish(new Error('La imagen ha tardado demasiado')), timeoutMs);
                function finish(error) {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timer);
                    image.onload = null;
                    image.onerror = null;
                    error ? reject(error) : resolve(true);
                }
                image.onload = () => finish();
                image.onerror = () => finish(new Error('La imagen no se puede cargar'));
                image.src = url;
            });
        }

        function extractEmbeddedVintedImageUrl(html) {
            // Algunas versiones de Vinted dejan las fotos dentro de JSON incrustado en scripts.
            // Normalizamos las barras escapadas y las entidades sin ejecutar ese JavaScript.
            const normalized = String(html || '')
                .replace(/&amp;/gi, '&')
                .replace(/\\u002f/gi, '/')
                .replace(/\\u003a/gi, ':')
                .replace(/\\u0026/gi, '&')
                .replace(/\\\//g, '/');
            const matches = normalized.match(/https?:\/\/images\d*\.vinted\.net\/[^\s"'<>\\]+/gi) || [];
            for (let raw of matches) {
                raw = raw.replace(/[),;\]}]+$/g, '').trim();
                try {
                    const u = new URL(raw);
                    if (isVintedImageUrl(u.href) && /\/t\//i.test(u.pathname)) return u.href;
                } catch (_) {}
            }
            return '';
        }

        function extractMetadataFromHtml(html) {
            if (typeof html !== 'string' || !html.trim()) throw new Error('La fuente no devolvió HTML.');
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const readMeta = (selectors) => {
                for (const selector of selectors) {
                    const element = doc.querySelector(selector);
                    if (element) {
                        const value = element.getAttribute('content');
                        if (value) return value.trim();
                    }
                }
                return '';
            };

            let image = readMeta([
                'meta[property="og:image:secure_url"]',
                'meta[property="og:image"]',
                'meta[name="twitter:image"]'
            ]).replace(/&amp;/g, '&');
            let title = readMeta(['meta[property="og:title"]', 'meta[name="twitter:title"]']);

            // Alternativa cuando Vinted incluye los datos de la prenda en JSON-LD.
            if (!isVintedImageUrl(image)) {
                const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
                for (const script of scripts) {
                    try {
                        const json = JSON.parse(script.textContent || 'null');
                        const stack = Array.isArray(json) ? [...json] : [json];
                        while (stack.length) {
                            const node = stack.pop();
                            if (!node || typeof node !== 'object') continue;
                            if (Array.isArray(node)) { stack.push(...node); continue; }
                            const types = Array.isArray(node['@type']) ? node['@type'] : [node['@type']];
                            if (!title && typeof node.name === 'string') title = node.name;
                            if (types.some(t => String(t || '').toLowerCase() === 'product') && node.image) {
                                const candidate = Array.isArray(node.image) ? node.image[0] : node.image;
                                const possible = typeof candidate === 'string' ? candidate : (candidate.url || candidate.contentUrl || '');
                                if (isVintedImageUrl(possible)) { image = possible; break; }
                            }
                            for (const value of Object.values(node)) {
                                if (value && typeof value === 'object') stack.push(value);
                            }
                        }
                    } catch (_) {}
                    if (isVintedImageUrl(image)) break;
                }
            }

            // Fallback adicional: localizar URL del CDN de imágenes dentro del HTML completo.
            if (!isVintedImageUrl(image)) image = extractEmbeddedVintedImageUrl(html);
            image = String(image || '').replace(/&amp;/g, '&').trim();
            if (image.startsWith('//')) image = 'https:' + image;
            if (!isVintedImageUrl(image)) {
                const normalized = String(html).replace(/\\\//g, '/').replace(/\\u002f/gi, '/');
                const candidates = (normalized.match(/https?:\/\/images\d*\.vinted\.net\//gi) || []).length;
                const likelyBlocked = /captcha|verify you are human|access denied|temporarily blocked|cloudflare/i.test(normalized);
                throw new Error(`No se encontró una foto válida en el HTML (fotos Vinted detectadas: ${candidates}; posible bloqueo: ${likelyBlocked ? 'sí' : 'no'}).`);
            }
            return { image, title: String(title || '').trim() };
        }

        async function fetchHtmlThroughProxy(proxyUrl, responseMode = 'text') {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 12000);
            try {
                const response = await fetch(proxyUrl, { signal: controller.signal, cache: 'no-store' });
                if (!response.ok) throw new Error('El proxy respondió con error ' + response.status);
                if (responseMode === 'allorigins') {
                    const data = await response.json();
                    if (!data || typeof data.contents !== 'string') throw new Error('Respuesta vacía del proxy');
                    return data.contents;
                }
                return await response.text();
            } finally {
                clearTimeout(timer);
            }
        }

        async function getMetadataFromWorker(url) {
            if (!VINTED_METADATA_WORKER) throw new Error('Worker no configurado');
            const endpoint = new URL(VINTED_METADATA_WORKER);
            endpoint.searchParams.set('url', url);
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 14000);
            try {
                const response = await fetch(endpoint.toString(), { signal: controller.signal, cache: 'no-store' });
                const data = await response.json();
                if (!response.ok || !data || !data.image) {
                    throw new Error((data && data.error) || 'El servicio no encontró la foto');
                }
                if (!isVintedImageUrl(data.image)) throw new Error('El servicio devolvió una imagen no válida');
                return { image: data.image, title: String(data.title || '').trim() };
            } finally {
                clearTimeout(timer);
            }
        }

        async function getMetadataFromPublicProxies(url) {
            const sources = [
                () => fetchHtmlThroughProxy(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, 'allorigins'),
                () => fetchHtmlThroughProxy(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, 'text')
            ];
            const failures = [];
            for (const getHtml of sources) {
                try {
                    const html = await getHtml();
                    return extractMetadataFromHtml(html);
                } catch (error) {
                    failures.push(error);
                }
            }
            throw new AggregateError(failures, 'Los proxies públicos no han podido extraer la foto');
        }

        // Busca y valida automáticamente una foto real. Nunca asigna una imagen genérica.
        async function fetchRealVintedData(rawUrl) {
            const url = String(rawUrl || '').trim();
            const requestId = ++activeScrapeRequestId;
            const statusBox = document.getElementById('scraping-status');
            const statusText = document.getElementById('scraping-text');
            const previewContainer = document.getElementById('image-preview-container');
            const previewImg = document.getElementById('image-preview');
            const imageInput = document.getElementById('item-image-url');

            imageInput.value = '';
            previewImg.removeAttribute('src');
            previewContainer.classList.add('hidden');
            setAddSaveState(false, 'Buscando foto automática...');

            if (!url) {
                statusBox.classList.add('hidden');
                return;
            }
            statusBox.classList.remove('hidden');
            if (!isVintedListingUrl(url)) {
                statusText.textContent = 'Pega un enlace válido a un anuncio de Vinted.';
                setAddSaveState(false, 'Enlace de Vinted no válido');
                return;
            }

            statusText.textContent = VINTED_METADATA_WORKER
                ? 'Buscando la foto en Vinted y verificando que carga...'
                : 'Buscando la foto automáticamente. Para más fiabilidad, configura el Worker incluido...';

            const attempts = [];
            if (VINTED_METADATA_WORKER) attempts.push(() => getMetadataFromWorker(url));
            // Se intentan también por separado para pasar al siguiente origen si la primera imagen no carga.
            attempts.push(async () => extractMetadataFromHtml(await fetchHtmlThroughProxy(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, 'allorigins')));
            attempts.push(async () => extractMetadataFromHtml(await fetchHtmlThroughProxy(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, 'text')));

            try {
                // Cada origen debe entregar una imagen de Vinted que además cargue correctamente.
                const metadata = await Promise.any(attempts.map(async (getMetadata) => {
                    const result = await getMetadata();
                    if (!isVintedImageUrl(result.image)) throw new Error('La dirección no pertenece al servidor de imágenes de Vinted');
                    await waitForImageToLoad(result.image, 10000);
                    return result;
                }));
                // Evita que una respuesta antigua pise la importación que el usuario acaba de iniciar.
                if (requestId !== activeScrapeRequestId) return;

                imageInput.value = metadata.image;
                previewImg.src = metadata.image;
                previewContainer.classList.remove('hidden');
                statusText.textContent = 'Foto real obtenida y verificada. Ya puedes guardar la prenda.';
                setAddSaveState(true, 'Guardar Prenda');

                const titleInput = document.getElementById('item-title');
                const oldAutoTitle = generateTitleFromUrl(url);
                if (metadata.title && (!titleInput.value.trim() || titleInput.value === 'Prenda de Vinted' || titleInput.value === oldAutoTitle)) {
                    titleInput.value = metadata.title;
                }
            } catch (error) {
                if (requestId !== activeScrapeRequestId) return;
                console.error('No se pudo obtener automáticamente la foto de Vinted:', error);
                imageInput.value = '';
                previewContainer.classList.add('hidden');
                const scrapeErrors = error instanceof AggregateError ? (error.errors || []) : [error];
                const scrapeDetails = [...new Set(scrapeErrors.map(e => String(e && e.message || e)).filter(Boolean))].slice(0, 2).join(' · ');
                statusText.textContent = 'No se pudo obtener la foto real automáticamente. ' + (scrapeDetails ? ('Detalle: ' + scrapeDetails.slice(0, 260) + '. ') : '') + 'No se guardará una imagen genérica.';
                setAddSaveState(false, 'Foto automática no disponible');
            }
        }

        function handleAddItem(e) {
            e.preventDefault();
            const url = document.getElementById('item-url').value.trim();
            const title = document.getElementById('item-title').value.trim();
            const folderId = parseInt(document.getElementById('item-folder').value, 10);
            const image = document.getElementById('item-image-url').value;

            if (!isVintedListingUrl(url) || !isVintedImageUrl(image)) {
                alert('No se puede guardar todavía: la aplicación necesita obtener y verificar automáticamente la foto real de Vinted.');
                if (url) fetchRealVintedData(url);
                return;
            }
            if (!db || !Number.isFinite(folderId)) {
                alert('No se ha podido acceder a la base de datos o a una carpeta. Recarga la página e inténtalo de nuevo.');
                return;
            }

            const tx = db.transaction('items', 'readwrite');
            const store = tx.objectStore('items');
            const req = store.add({ folderId, title, url, image, createdAt: Date.now() });

            req.onsuccess = () => {
                closeAddModal();
                goHome();
            };
            req.onerror = () => alert('No se ha podido guardar la prenda. Comprueba el almacenamiento del navegador.');
        }

        // También intenta la extracción automática si el enlace se pega/escribe manualmente.
        document.getElementById('item-url').addEventListener('input', () => {
            activeScrapeRequestId++;
            if (urlInputDebounce) clearTimeout(urlInputDebounce);
            document.getElementById('item-image-url').value = '';
            document.getElementById('image-preview').removeAttribute('src');
            document.getElementById('image-preview-container').classList.add('hidden');
            setAddSaveState(false, 'Esperando foto automática...');
            const value = document.getElementById('item-url').value.trim();
            if (!value) {
                document.getElementById('scraping-status').classList.add('hidden');
                return;
            }
            document.getElementById('scraping-status').classList.remove('hidden');
            document.getElementById('scraping-text').textContent = 'Enlace detectado. Iniciando búsqueda automática...';
            urlInputDebounce = setTimeout(() => fetchRealVintedData(value), 800);
        });

        async function openItemDetailModal(item) {
            activeEditingItem = item;
            document.getElementById('detail-image').src = item.image;
            document.getElementById('detail-vinted-link').href = item.url;
            document.getElementById('edit-item-id').value = item.id;
            document.getElementById('edit-item-title').value = item.title;
            document.getElementById('edit-item-url').value = item.url;

            await updateFolderSelects();
            document.getElementById('edit-item-folder').value = item.folderId;

            document.getElementById('item-detail-modal').classList.remove('hidden');
        }

        function closeItemDetailModal() {
            document.getElementById('item-detail-modal').classList.add('hidden');
            activeEditingItem = null;
        }

        function handleSaveItemEdit(e) {
            e.preventDefault();
            if (!activeEditingItem) return;

            const updatedTitle = document.getElementById('edit-item-title').value;
            const updatedUrl = document.getElementById('edit-item-url').value;
            const updatedFolderId = parseInt(document.getElementById('edit-item-folder').value);

            const tx = db.transaction('items', 'readwrite');
            const store = tx.objectStore('items');

            const updatedItem = {
                ...activeEditingItem,
                title: updatedTitle,
                url: updatedUrl,
                folderId: updatedFolderId
            };

            store.put(updatedItem).onsuccess = () => {
                closeItemDetailModal();
                goHome();
            };
        }

        function deleteItemFromDetail() {
            if (!activeEditingItem) return;
            if (!confirm("¿Seguro que quieres eliminar esta prenda?")) return;

            const tx = db.transaction('items', 'readwrite');
            const store = tx.objectStore('items');
            store.delete(activeEditingItem.id).onsuccess = () => {
                closeItemDetailModal();
                goHome();
            };
        }

        // Arrancar la base de datos de inmediato
        initAppDatabase();
    </script>
</body>

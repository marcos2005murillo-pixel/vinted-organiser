<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinted Organiser</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- CABECERA PRINCIPAL -->
    <header class="bg-white border-b border-slate-100 px-5 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-teal-600 rounded-xl flex items-center justify-center text-white shadow-sm">
                <i class="fa-solid fa-shirt text-lg"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">Vinted Organiser</h1>
        </div>
        <button onclick="openNewFolderModal()" class="w-9 h-9 bg-teal-50 hover:bg-teal-100 text-teal-700 rounded-xl flex items-center justify-center transition border border-teal-100">
            <i class="fa-solid fa-folder-plus text-sm"></i>
        </button>
    </header>

    <!-- PESTAÑAS DE CARPETAS -->
    <div class="bg-white border-b border-slate-100 px-5 py-3 overflow-x-auto flex items-center space-x-2">
        <div id="folder-tabs" class="flex space-x-2">
            <!-- Pestañas dinámicas -->
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-5 space-y-5">
        
        <!-- BARRA SUPERIOR: TITULO, CONTAJE Y BUSCADOR -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <h2 id="active-folder-title" class="text-2xl font-bold text-slate-900">Desperdigadas</h2>
                    <span id="active-folder-badge" class="bg-slate-100 text-slate-600 font-semibold text-xs px-2.5 py-1 rounded-full">0</span>
                </div>
                <p id="total-items-count" class="text-xs text-slate-400 font-medium mt-1">0 Prendas guardadas en total</p>
            </div>

            <div class="flex items-center gap-2">
                <div class="relative flex-1 sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="filterItems()" placeholder="Buscar..." 
                        class="w-full bg-white border border-slate-200 rounded-2xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-teal-500 shadow-sm transition">
                </div>
                <button onclick="openAddModal()" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-4 py-2.5 rounded-2xl text-sm flex items-center gap-2 shadow-sm transition shrink-0">
                    <i class="fa-solid fa-plus"></i> <span>Añadir</span>
                </button>
            </div>
        </div>

        <!-- REJILLA DE PRENDAS -->
        <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <!-- Se renderizan aquí -->
        </div>

        <!-- ESTADO VACÍO -->
        <div id="empty-state" class="hidden py-20 text-center space-y-3">
            <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto text-slate-300 text-2xl">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <p class="text-slate-400 text-sm font-medium">No hay prendas en esta carpeta</p>
        </div>

    </main>

    <!-- MODAL: DETALLE EN GRANDE Y EDICIÓN -->
    <div id="item-detail-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-900">Detalle de la prenda</h3>
                <button onclick="closeItemDetailModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl hover:bg-slate-100 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Imagen grande de la prenda -->
            <div class="w-full h-72 bg-slate-100 rounded-2xl overflow-hidden relative border border-slate-200/60">
                <img id="detail-image" src="" alt="Prenda" class="w-full h-full object-cover">
                <a id="detail-vinted-link" href="#" target="_blank" class="absolute bottom-3 right-3 bg-white/95 hover:bg-white text-slate-900 px-3.5 py-2 rounded-xl text-xs font-bold backdrop-blur-md transition flex items-center gap-2 shadow-sm border border-slate-200">
                    <i class="fa-solid fa-arrow-up-right-from-square text-teal-600"></i> Abrir en Vinted
                </a>
            </div>

            <!-- Formulario de Edición -->
            <form id="edit-item-form" onsubmit="handleSaveItemEdit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nombre</label>
                    <input type="text" id="edit-item-title" required 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-teal-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Enlace de Vinted</label>
                    <input type="url" id="edit-item-url" required 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-teal-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Mover a Carpeta</label>
                    <select id="edit-item-folder" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-teal-500 transition">
                        <!-- Opciones dinámicas -->
                    </select>
                </div>

                <div class="pt-3 flex items-center justify-between border-t border-slate-100">
                    <button type="button" onclick="deleteItemFromDetail()" class="text-red-500 hover:text-red-600 hover:bg-red-50 px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> Eliminar
                    </button>
                    <div class="flex gap-2">
                        <button type="button" onclick="closeItemDetailModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl text-xs font-semibold transition">Cancelar</button>
                        <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-sm">Guardar cambios</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: AÑADIR PRENDA -->
    <div id="add-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-900">Añadir nueva prenda</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl hover:bg-slate-100 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="scraping-status" class="hidden bg-slate-50 border border-slate-200 p-3 rounded-2xl text-xs text-slate-600 flex items-center gap-3">
                <div class="w-4 h-4 border-2 border-teal-600/30 border-t-teal-600 rounded-full animate-spin shrink-0"></div>
                <span id="scraping-text">Obteniendo foto e información...</span>
            </div>

            <form onsubmit="handleAddItem(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Enlace de Vinted</label>
                    <input type="url" id="item-url" required placeholder="https://www.vinted.es/items/..." 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nombre / Título</label>
                    <input type="text" id="item-title" required placeholder="Ej. Chaqueta Vinted" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Carpeta</label>
                    <select id="item-folder" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 transition">
                        <!-- Opciones dinámicas -->
                    </select>
                </div>

                <input type="hidden" id="item-image-url" value="">

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-2.5 rounded-xl text-sm transition">Cancelar</button>
                    <button type="submit" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">Guardar prenda</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: NUEVA CARPETA -->
    <div id="new-folder-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-900">Nueva Carpeta</h3>
                <button onclick="closeNewFolderModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl hover:bg-slate-100 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form onsubmit="handleCreateFolder(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nombre de la carpeta</label>
                    <input type="text" id="new-folder-name" required placeholder="Ej. Marcos, Carol..." 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 transition">
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="closeNewFolderModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-2.5 rounded-xl text-sm transition">Cancelar</button>
                    <button type="submit" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT AUTOSUFICIENTE -->
    <script>
        let db;
        let activeFolderId = null;
        let activeEditingItem = null;
        let allCurrentItems = [];

        function initDB() {
            // Nombre y versión limpia para evitar choques
            const request = indexedDB.open('VintedWardrobeDB_v10', 1);

            request.onerror = (e) => {
                console.error("Error cargando DB:", e);
            };

            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains('folders')) {
                    db.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
                }
                if (!db.objectStoreNames.contains('items')) {
                    const itemStore = db.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
                    itemStore.createIndex('folderId', 'folderId', { unique: false });
                }
            };

            request.onsuccess = (e) => {
                db = e.target.result;
                seedDefaults();
            };
        }

        function seedDefaults() {
            const tx = db.transaction('folders', 'readwrite');
            const store = tx.objectStore('folders');
            const countReq = store.count();

            countReq.onsuccess = () => {
                if (countReq.result === 0) {
                    store.add({ name: 'Desperdigadas', createdAt: Date.now() });
                    store.add({ name: 'Carol', createdAt: Date.now() });
                    store.add({ name: 'Marcos', createdAt: Date.now() });
                    tx.oncomplete = () => initApp();
                } else {
                    initApp();
                }
            };
        }

        function initApp() {
            loadTabs();
            checkUrlParams();
        }

        // CAPTURA DE ENLACE DE VINTED COMPARTIDO
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const shareUrl = params.get('url') || params.get('text');
            const shareTitle = params.get('title');

            if (shareUrl) {
                const cleanUrl = extractFirstUrl(shareUrl);
                if (cleanUrl) {
                    openAddModal(cleanUrl, shareTitle || 'Nueva prenda de Vinted');
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }

        function extractFirstUrl(text) {
            const match = text.match(/(https?:\/\/[^\s]+)/g);
            return match ? match[0] : text;
        }

        // GESTIÓN DE CARPETAS Y PESTAÑAS
        function loadTabs() {
            if (!db) return;
            const tx = db.transaction(['folders', 'items'], 'readonly');
            const folderStore = tx.objectStore('folders');
            const itemStore = tx.objectStore('items');

            folderStore.getAll().onsuccess = (e) => {
                const folders = e.target.result;
                const tabsContainer = document.getElementById('folder-tabs');
                tabsContainer.innerHTML = '';

                itemStore.getAll().onsuccess = (itemEv) => {
                    const allItems = itemEv.target.result;
                    document.getElementById('total-items-count').textContent = `${allItems.length} Prendas guardadas en total`;

                    if (!activeFolderId && folders.length > 0) {
                        activeFolderId = folders[0].id;
                    }

                    folders.forEach(folder => {
                        const count = allItems.filter(i => i.folderId === folder.id).length;
                        const isActive = folder.id === activeFolderId;

                        const btn = document.createElement('button');
                        btn.onclick = () => selectFolder(folder.id);
                        btn.className = isActive 
                            ? "bg-teal-700 text-white font-semibold px-4 py-2 rounded-2xl text-xs flex items-center gap-2 shadow-sm shrink-0 transition"
                            : "bg-white hover:bg-slate-100 text-slate-700 font-medium px-4 py-2 rounded-2xl text-xs flex items-center gap-2 shrink-0 border border-slate-100 transition";
                        
                        btn.innerHTML = `<span>${folder.name}</span> <span class="${isActive ? 'bg-teal-800 text-teal-100' : 'bg-slate-100 text-slate-500'} text-[10px] px-2 py-0.5 rounded-full font-bold">${count}</span>`;
                        tabsContainer.appendChild(btn);

                        if (isActive) {
                            document.getElementById('active-folder-title').textContent = folder.name;
                            document.getElementById('active-folder-badge').textContent = count;
                        }
                    });

                    loadItemsForActiveFolder();
                };
            };
        }

        function selectFolder(folderId) {
            activeFolderId = folderId;
            loadTabs();
        }

        function loadItemsForActiveFolder() {
            if (!activeFolderId || !db) return;
            const tx = db.transaction('items', 'readonly');
            const store = tx.index('folderId');

            store.getAll(activeFolderId).onsuccess = (e) => {
                allCurrentItems = e.target.result;
                renderItems(allCurrentItems);
            };
        }

        function renderItems(items) {
            const grid = document.getElementById('items-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl overflow-hidden cursor-pointer shadow-sm hover:shadow-md transition flex flex-col group";
                card.onclick = () => openItemDetailModal(item);

                card.innerHTML = `
                    <div class="h-44 bg-slate-100 overflow-hidden relative">
                        <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${item.title}">
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <h4 class="font-medium text-xs text-slate-800 line-clamp-2 leading-snug">${item.title}</h4>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterItems() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allCurrentItems.filter(item => item.title.toLowerCase().includes(query));
            renderItems(filtered);
        }

        // DETALLE Y EDICIÓN
        async function openItemDetailModal(item) {
            activeEditingItem = item;
            document.getElementById('detail-image').src = item.image;
            document.getElementById('detail-vinted-link').href = item.url;
            document.getElementById('edit-item-title').value = item.title;
            document.getElementById('edit-item-url').value = item.url;

            await populateFolderOptions();
            document.getElementById('edit-item-folder').value = item.folderId;

            document.getElementById('item-detail-modal').classList.remove('hidden');
        }

        function closeItemDetailModal() {
            document.getElementById('item-detail-modal').classList.add('hidden');
            activeEditingItem = null;
        }

        function handleSaveItemEdit(e) {
            e.preventDefault();
            if (!activeEditingItem) return;

            const updatedTitle = document.getElementById('edit-item-title').value;
            const updatedUrl = document.getElementById('edit-item-url').value;
            const updatedFolderId = parseInt(document.getElementById('edit-item-folder').value);

            const tx = db.transaction('items', 'readwrite');
            const store = tx.objectStore('items');

            const updatedItem = {
                ...activeEditingItem,
                title: updatedTitle,
                url: updatedUrl,
                folderId: updatedFolderId
            };

            store.put(updatedItem).onsuccess = () => {
                closeItemDetailModal();
                loadTabs();
            };
        }

        function deleteItemFromDetail() {
            if (!activeEditingItem) return;
            if (!confirm("¿Borrar esta prenda?")) return;

            const tx = db.transaction('items', 'readwrite');
            const store = tx.objectStore('items');

            store.delete(activeEditingItem.id).onsuccess = () => {
                closeItemDetailModal();
                loadTabs();
            };
        }

        // CREAR CARPETA
        function openNewFolderModal() {
            document.getElementById('new-folder-modal').classList.remove('hidden');
            document.getElementById('new-folder-name').value = '';
            document.getElementById('new-folder-name').focus();
        }

        function closeNewFolderModal() {
            document.getElementById('new-folder-modal').classList.add('hidden');
        }

        function handleCreateFolder(e) {
            e.preventDefault();
            const nameInput = document.getElementById('new-folder-name');
            const name = nameInput.value.trim();
            if (!name || !db) return;

            const tx = db.transaction('folders', 'readwrite');
            const store = tx.objectStore('folders');
            
            const addReq = store.add({ name: name, createdAt: Date.now() });

            addReq.onsuccess = (ev) => {
                activeFolderId = ev.target.result;
                closeNewFolderModal();
                loadTabs();
            };
        }

        // AÑADIR PRENDA
        async function openAddModal(prefillUrl = '', prefillTitle = '') {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('item-url').value = prefillUrl;
            document.getElementById('item-title').value = prefillTitle;
            document.getElementById('item-image-url').value = '';

            await populateFolderOptions();
            if (activeFolderId) {
                document.getElementById('item-folder').value = activeFolderId;
            }

            if (prefillUrl) {
                extractData(prefillUrl);
            }
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('scraping-status').classList.add('hidden');
        }

        async function populateFolderOptions() {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction('folders', 'readonly');
                tx.objectStore('folders').getAll().onsuccess = (e) => {
                    const folders = e.target.result;
                    const selects = [document.getElementById('item-folder'), document.getElementById('edit-item-folder')];
                    selects.forEach(select => {
                        select.innerHTML = '';
                        folders.forEach(f => {
                            const opt = document.createElement('option');
                            opt.value = f.id;
                            opt.textContent = f.name;
                            select.appendChild(opt);
                        });
                    });
                    resolve();
                };
            });
        }

        async function extractData(url) {
            const statusBox = document.getElementById('scraping-status');
            const statusText = document.getElementById('scraping-text');
            statusBox.classList.remove('hidden');
            statusText.textContent = "Obteniendo foto de Vinted...";

            let imageUrl = '';
            const proxies = [
                `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy);
                    const html = proxy.includes('allorigins') ? (await res.json()).contents : await res.text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');

                    const ogImage = doc.querySelector('meta[property="og:image"]');
                    const ogTitle = doc.querySelector('meta[property="og:title"]');

                    if (ogImage && ogImage.content) imageUrl = ogImage.content;
                    if (ogTitle && (!document.getElementById('item-title').value || document.getElementById('item-title').value === 'Nueva prenda de Vinted')) {
                        document.getElementById('item-title').value = ogTitle.content;
                    }
                    if (imageUrl) break;
                } catch (e) {}
            }

            if (imageUrl) {
                document.getElementById('item-image-url').value = imageUrl;
                statusText.textContent = "¡Foto obtenida con éxito!";
            } else {
                document.getElementById('item-image-url').value = "https://placehold.co/600x800/f1f5f9/94a3b8?text=Vinted";
                statusText.textContent = "Guardando con foto por defecto.";
            }

            setTimeout(() => statusBox.classList.add('hidden'), 2000);
        }

        function handleAddItem(e) {
            e.preventDefault();
            const url = document.getElementById('item-url').value;
            const title = document.getElementById('item-title').value;
            const folderId = parseInt(document.getElementById('item-folder').value);
            let image = document.getElementById('item-image-url').value || "https://placehold.co/600x800/f1f5f9/94a3b8?text=Vinted";

            const tx = db.transaction('items', 'readwrite');
            tx.objectStore('items').add({ folderId, title, url, image, createdAt: Date.now() }).onsuccess = () => {
                closeAddModal();
                loadTabs();
            };
        }

        window.onload = initDB;
    </script>
</body>
</html>
